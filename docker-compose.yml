services:
  web:
    image: lapartideta:local
    build:
      context: .
      dockerfile: docker/Dockerfile.umbrel
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Configura VITE_SUPABASE_URL en .env.local}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Configura VITE_SUPABASE_ANON_KEY en .env.local}
    restart: unless-stopped
    ports:
      - "${LAPARTIDETA_PORT:-8090}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
