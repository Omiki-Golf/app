server {
    listen 80 default_server;
    server_name app.omikigolf.com golf.arinsaldev.com;
    root /usr/share/nginx/html;
    index index.html;
    location ~* \.(sql|bak|env)$ { return 404; }
    # Versioned build assets change URL on every release; HTML must still revalidate.
    location ~ ^/assets/[^/]+-v[0-9]+-[A-Za-z0-9_-]+\.(js|css|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }
    location / {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
